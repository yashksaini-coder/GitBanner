name: Refresh GitBanner

on:
  schedule:
    # Daily, off-peak odd minute: GitHub delays or drops crons scheduled at
    # popular times (top of the hour, especially midnight UTC). The output is
    # byte-stable, so quiet days produce no commit — the cost of daily is zero
    # and the headline numbers are never more than a day stale.
    - cron: '47 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # A released code change refreshes the cards immediately. The refresh
    # commit below touches only out/, so this cannot loop.
    paths: ['dist/**']

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          github-token: ${{ secrets.GITBANNER_PAT }}
          username: ${{ github.repository_owner }}
          theme: dark
          format: both
          include-private: true
          commit: true
          output-path: out/gitbanner
