name: GitBanner Profile Card
description: 'Generate an open-source contribution banner: PRs merged into other people''s repos, reviews given, projects shipped to, issues resolved (SVG + PNG).'
author: yashksaini-coder
branding:
  icon: bar-chart-2
  color: purple

inputs:
  github-token:
    description: |
      A GitHub personal access token used to query the GraphQL/REST APIs.
      Required scopes: read:user (and repo if include-private is true).
      Defaults to github.token in workflows, but a PAT is recommended for full data.
    required: true

  username:
    description: GitHub login to render. Defaults to the repository owner.
    required: false
    default: ''

  theme:
    description: 'Theme name. Currently supported: dark.'
    required: false
    default: dark

  format:
    description: Output format — svg, png, or both.
    required: false
    default: both

  output-path:
    description: Output path without extension. Files are written as <output-path>.svg and <output-path>.png.
    required: false
    default: gitbanner

  include-private:
    description: Include private repository stats (requires repo scope on the token).
    required: false
    default: 'false'

  exclude:
    description: |
      Comma-separated list of repository names to exclude from per-repo
      calculations (top lists, languages, project highlights). The user's
      profile README repo (a repo named exactly after the user) is always
      excluded automatically.
    required: false
    default: ''

  tiles:
    description: |
      Comma-separated tiles to render, in order. Only the GraphQL queries the
      selected tiles need are issued — dropping `own-stars`, for example, skips
      repository pagination entirely.

      Chart cards (tall):
        commit-pulse  my commits per week across my newest repos, 52 weeks
        activity    external merges per month, trailing 12 months
        ships-in    languages of the external projects you ship in
        reviews     code reviews you gave on others' repos
        projects    distinct external projects you've landed work in
        issues      issues filed in others' repos that got resolved, per year
      Mini tiles (short):
        biggest-project, merge-rate, own-stars

      Default: commit-pulse,activity,ships-in,reviews,projects,issues,
               biggest-project,merge-rate,own-stars
    required: false
    default: ''

  min-merged-prs:
    description: |
      How many merged PRs a repository needs before it counts as one you have
      contributed to. Guards the projects, biggest-project and ships-in tiles
      against one-off drive-by PRs — a single PR into a 55k-star tutorial
      repo would otherwise dominate your project claims.
      Set to 1 to count every repository you have ever landed a PR in.
    required: false
    default: '2'

  ignore-languages:
    description: |
      Comma-separated language names to hide from the ships-in language tiles,
      matched case-insensitively. Linguist already excludes vendored and
      generated files automatically; use this for languages you legitimately
      ship but don't want leading your card (e.g. `HTML,CSS`).
    required: false
    default: ''

  since:
    description: |
      Scope the card to work done on or after this date (YYYY-MM-DD, UTC).
      Combine with `until` for a weekly or monthly card. Omit both for all time.
      GitHub caps contribution windows at one year.
    required: false
    default: ''

  until:
    description: |
      Scope the card to work done on or before this date (YYYY-MM-DD, UTC,
      inclusive of the whole day). Requires `since` — contribution windows
      are capped at one year, so an open-ended "everything before" range
      cannot be answered honestly.
    required: false
    default: ''

  commit:
    description: When true, commit and push the regenerated card if it changed.
    required: false
    default: 'true'

  commit-message:
    description: Commit message used when committing the regenerated card.
    required: false
    default: 'chore: refresh GitBanner stats'

outputs:
  card-path:
    description: Filesystem path of the primary generated card (SVG by default, PNG if format=png).

runs:
  using: node20
  main: dist/index.js
